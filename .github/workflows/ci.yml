name: Bit Select CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: 仓库与凭证检查
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.components.outputs.backend }}
      web: ${{ steps.components.outputs.web }}
      infra: ${{ steps.components.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 检查文件编码、私密配置与密钥
        run: python scripts/check-repository.py
      - name: 核验排序数据与模型指纹
        run: python data/ranking/verify-artifacts.py
      - id: components
        name: 识别已提交组件
        run: |
          for component in backend web infra; do
            if test -d "$component"; then echo "$component=true" >> "$GITHUB_OUTPUT"; else echo "$component=false" >> "$GITHUB_OUTPUT"; fi
          done
      - name: 检查 PR 标题
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python - <<'PY'
          import os, re
          title = os.environ['PR_TITLE']
          assert re.fullmatch(r'(feat|fix|docs|test|refactor|chore|build|ci|perf):[^/\n]+/[^\n]*[\u4e00-\u9fff][^\n]*', title), 'PR 标题应为 type:English title/中文标题'
          PY

  backend:
    name: Java 21 后端构建与测试
    needs: repository
    if: needs.repository.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 编译并运行真实测试
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: 确认测试未被跳过
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('backend').glob('**/target/surefire-reports/TEST-*.xml'))
          roots = [ET.parse(report).getroot() for report in reports]
          executed = sum(int(r.get('tests', 0)) - int(r.get('skipped', 0)) for r in roots)
          assert executed > 0, '后端必须实际执行测试，不能以空测试套件通过'
          print(f'后端实际执行 {executed} 个测试')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: backend/**/target/surefire-reports/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: backend/**/target/*.jar
          if-no-files-found: error

  idea:
    name: IDEA 启动配置回归
    needs: repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 验证共享与已有运行配置更新
        shell: pwsh
        run: ./scripts/Test-IdeaRunConfigurations.ps1

  web:
    name: Next.js 前端构建与测试
    needs: repository
    if: needs.repository.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            web/.next/
            !web/.next/cache/
          include-hidden-files: true
          if-no-files-found: error

  infrastructure:
    name: 容器配置与隔离检查
    needs: repository
    if: needs.repository.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 Compose
        run: |
          docker compose --env-file infra/.env.example -f infra/compose.yml --profile full config --quiet
          docker compose --env-file infra/.env.example -f infra/compose.yml --profile full config --format json | python scripts/check-compose.py

  integration:
    name: 微服务交易与 AI 权限集成
    needs: [repository, backend, infrastructure]
    if: needs.repository.outputs.backend == 'true' && needs.repository.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: local_example_admin_change_me
      FRONTEND_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装真实 Next.js 代理验收依赖
        run: npm --prefix web ci
      - uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: .local/backend-jars
      - name: 启动真实中间件
        run: docker compose --env-file infra/.env.example -f infra/compose.yml up -d --wait --wait-timeout 240
      - name: 启动商城与 AI 业务服务
        run: |
          mkdir -p .local/logs
          set -a
          source infra/.env.example
          export CATALOG_SEED_PATH="$GITHUB_WORKSPACE/data/products.json"
          set +a
          for service in catalog-service commerce-service gateway; do
            jar=$(find ".local/backend-jars/$service/target" -maxdepth 1 -name '*.jar' ! -name '*original*' | head -1)
            test -n "$jar"
            java -Xms64m -Xmx256m -XX:ActiveProcessorCount=2 -jar "$jar" > ".local/logs/$service.log" 2>&1 &
          done
          jar=$(find .local/backend-jars/ai-service/target -maxdepth 1 -name '*.jar' ! -name '*original*' | head -1)
          test -n "$jar"
          export AI_RANKING_MODEL="$GITHUB_WORKSPACE/data/ranking/model.json"
          java -Xms64m -Xmx512m -XX:ActiveProcessorCount=2 -jar "$jar" > .local/logs/ai-service.log 2>&1 &
      - name: 验证真实交易链路
        run: python scripts/smoke-test.py --wait-seconds 180
      - name: 验证真实并发库存与支付
        run: python scripts/real-concurrency-test.py
      - name: 验证 AI 真实权限与用户隔离（无模型调用）
        run: python scripts/ai-smoke-test.py --wait-seconds 90
      - name: 验证 SSE 代理、提前输出、超时与取消（本地模拟模型）
        run: python scripts/sse-integration-test.py --jar-dir .local/backend-jars --env-file infra/.env.example --with-next
      - name: 失败时输出服务诊断
        if: failure()
        run: |
          for file in .local/logs/*.log; do test ! -f "$file" || tail -100 "$file"; done
          docker compose --env-file infra/.env.example -f infra/compose.yml ps
      - name: 保留集成日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: .local/logs/
          include-hidden-files: true
      - name: 保留 SSE 集成证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sse-integration-evidence
          include-hidden-files: true
          path: |
            .local/sse-integration/*/results.json
            .local/sse-integration/*/ai.log
            .local/sse-integration/*/gateway.log
            .local/sse-integration/*/next.log
          if-no-files-found: ignore
      - name: 关闭 CI 临时容器
        if: always()
        run: docker compose --env-file infra/.env.example -f infra/compose.yml down
