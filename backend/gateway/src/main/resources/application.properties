server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.application.name=bit-gateway
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:16379}
spring.data.redis.password=${REDIS_PASSWORD:}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
app.catalog-url=${CATALOG_URL:http://127.0.0.1:8082}
app.commerce-url=${COMMERCE_URL:http://127.0.0.1:8081}
app.ai-url=${AI_URL:http://127.0.0.1:8083}
app.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}
app.blocked-ips=${BLOCKED_IPS:}
spring.http.codecs.max-in-memory-size=2MB
