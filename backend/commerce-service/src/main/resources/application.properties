server.port=${PORT:8081}
spring.application.name=commerce-service
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/${MYSQL_DATABASE:bit_select}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQL_USER:bit_select}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:16379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.flyway.enabled=true
spring.jackson.time-zone=UTC
server.error.include-message=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
dubbo.application.name=commerce-service
dubbo.application.qos-enable=false
dubbo.registry.address=nacos://${NACOS_ADDRESS:127.0.0.1:18848}
dubbo.registry.parameters.namespace=public
dubbo.protocol.name=dubbo
dubbo.protocol.port=20881
dubbo.consumer.check=false
dubbo.consumer.timeout=3000
dubbo.consumer.retries=0
app.cookie-secure=${COOKIE_SECURE:false}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
app.rocketmq.enabled=${ROCKETMQ_ENABLED:true}
app.rocketmq.namesrv=${ROCKETMQ_NAMESRV:127.0.0.1:19876}
server.address=${SERVER_ADDRESS:127.0.0.1}
