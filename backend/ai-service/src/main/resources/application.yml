server:
  address: 127.0.0.1
  port: ${AI_PORT:8083}
spring:
  application:
    name: bit-select-ai
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/${MYSQL_DATABASE:bit_select}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${MYSQL_USER:bit_select}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 5
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD}
  neo4j:
    uri: ${NEO4J_URI:bolt://127.0.0.1:17687}
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:}
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      request-timeout: 180000
dubbo:
  application:
    name: bit-select-ai
    qos-enable: false
  registry:
    address: nacos://${NACOS_ADDRESS:127.0.0.1:18848}
  protocol:
    name: dubbo
    port: ${AI_DUBBO_PORT:20883}
  consumer:
    check: false
    timeout: 5000
    retries: 0
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
ai:
  base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
  api-key: ${SILICONFLOW_API_KEY:}
  chat-model: ${SILICONFLOW_CHAT_MODEL:Qwen/Qwen3-30B-A3B-Instruct-2507}
  embedding-model: ${SILICONFLOW_EMBEDDING_MODEL:Qwen/Qwen3-Embedding-4B}
  rerank-model: ${SILICONFLOW_RERANK_MODEL:Qwen/Qwen3-Reranker-4B}
  context-tokens: ${AI_CONTEXT_TOKENS:262144}
  output-tokens: 2048
  embedding-dimension: 2560
  data-path: ${CATALOG_SEED_PATH:../data/products.json}
  milvus-url: ${MILVUS_URI:http://127.0.0.1:19530}
  tika-url: ${TIKA_URL:http://127.0.0.1:19998}
  rocketmq-address: ${ROCKETMQ_NAMESRV:127.0.0.1:19876}
  memory-enabled: ${AI_MEMORY_ENABLED:true}
  neo4j-uri: ${NEO4J_URI:bolt://127.0.0.1:17687}
  neo4j-user: ${NEO4J_USER:neo4j}
  neo4j-password: ${NEO4J_PASSWORD:}
  rustfs-url: ${RUSTFS_ENDPOINT:http://127.0.0.1:19000}
  rustfs-access-key: ${RUSTFS_ACCESS_KEY:}
  rustfs-secret-key: ${RUSTFS_SECRET_KEY:}
  rustfs-bucket: ${RUSTFS_BUCKET:bit-select-documents}
